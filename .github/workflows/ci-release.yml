name: Build Blockslab
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch wpfui (UI library)
        shell: pwsh
        run: |
          if (-not (Test-Path wpfui/.git) -and -not (Get-ChildItem wpfui -ErrorAction SilentlyContinue)) {
            Remove-Item wpfui -Recurse -Force -ErrorAction SilentlyContinue
            git clone --depth 1 https://github.com/bloxstraplabs/wpfui.git wpfui
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore

      - name: Publish (single-file .exe)
        run: dotnet publish .\Blockslab\Blockslab.csproj -p:PublishSingleFile=true -p:CommitHash=${{ github.sha }} -p:CommitRef=${{ github.ref_type }}/${{ github.ref_name }} -r win-x64 -c Release --self-contained false

      - name: Rename exe
        shell: pwsh
        run: Copy-Item .\Blockslab\bin\Release\net6.0-windows\win-x64\publish\Blockslab.exe .\Blockslab.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Blockslab-exe
          path: Blockslab.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Blockslab ${{ github.ref_name }}
          files: Blockslab.exe
          generate_release_notes: true
